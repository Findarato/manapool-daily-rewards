server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.html;

    location / {
        default_type application/json;
        types { }
        try_files $uri $uri/ =404;
    }

    # Prometheus text exposition, refreshed with index.html.
    location = /metrics {
        default_type text/plain;
        types { }
        try_files /metrics =404;
    }
}
